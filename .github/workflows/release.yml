name: "Release"
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
env:
  php-version: 8.3
  node-version: 22
  cache-version: 1
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer -n install

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package-lock.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Build"
        env:
          NODE_ENV: 'production'
        run: |
          npm run build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: dist

  package:
    name: "Upload a package to GitHub release"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Download artifact"
        uses: actions/download-artifact@v8
        with:
          name: "build-artifact"
          path: ${{ github.event.repository.name }}

      - name: Get the version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: "Create zip"
        run: |
          zip -r dist.zip ${{ github.event.repository.name }}

      - name: "Extract changelog"
        run: |
          sed -n '/=\s\?${{ steps.version.outputs.VERSION }}\s\?=/{:a;n;/=.*/b;p;ba}' ${{ github.event.repository.name }}/readme.txt > body.md

      # Creates the release, or - when it already exists (e.g. created in the GitHub UI, which also
      # pushes the tag that started this workflow) - only uploads the ZIP to it.
      - name: "Create or update the release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          ASSET: ${{ github.event.repository.name }}.${{ steps.version.outputs.VERSION }}.zip
        run: |
          mv dist.zip "$ASSET"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" "$ASSET" --title "Version $VERSION" --notes-file body.md --repo "$GITHUB_REPOSITORY"
          fi
